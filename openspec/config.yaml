schema: spec-driven

context: |
  Valoriza MEI: SaaS de gestão para MEI (precificação por markup, controle de estoque,
  alertas de ruptura e sugestões sazonais).
  Todos os artefatos devem ser escritos em português do Brasil.
  Stack: Java 21, Spring Boot 4.x (starters modulares, ex.: spring-boot-starter-webmvc),
  Maven, PostgreSQL 15, Liquibase, springdoc-openapi 3, Testcontainers. 
  Ambiente de desenvolvimento do autor: Windows (usar mvnw.cmd nos comandos).
  Pacote base br.com.valorizamei, organizado por feature:
  br.com.valorizamei.<feature>.{controller,service,repository,model,dto}, além disso aplicar solid e clean code;
  código transversal em br.com.valorizamei.shared.
  Dinheiro e percentuais sempre BigDecimal; nunca double ou float em regra de negócio.
  Multi-tenant por coluna tenant_id; o tenant vem sempre do JWT, nunca do corpo, query ou caminho.
  Schema do banco somente via changesets Liquibase; ddl-auto=validate.
  API versionada em /api/v1;
  Fórmulas do artigo: Markup = 100 / [100 - (DV + DF + ML)]; PV = Custo Direto × Markup.
  Cenário de referência para testes de aceitação: custo direto 18,00; DV 11%;
  DF 13% (despesas fixas 780,00 sobre receita estimada 6.000,00); ML 20%;
  markup 1,7857; preço calculado 32,14; preço sugerido 32,90; estoque inicial 15, mínimo 3.
  

rules:
  specs:
    - Todo requirement usa SHALL ou MUST e tem ao menos um cenário WHEN/THEN
  tasks:
    - Cada cenário da spec deve ter ao menos uma tarefa de teste correspondente
    - Quando a change tocar dados de negócio, incluir tarefa de teste de isolamento entre tenants